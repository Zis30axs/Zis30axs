<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>T-80U-E1 技术图解</title>
    <meta name="description" content="T-80U-E1 主战坦克交互式三维技术图解：爆炸拆解、自动装弹机到击发的全过程、弹种切换、入射分析与模块损伤。" />
    <script>
      // 在样式加载前恢复用户选择的主题，避免闪烁
      try {
        const t = localStorage.getItem('t80-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">T-80U-E1</span>
          <span class="brand-sub">主战坦克 · 交互式技术图解</span>
        </div>
        <nav class="tabs" role="tablist" aria-label="功能模式">
          <button type="button" role="tab" data-mode="overview" aria-selected="true">总览</button>
          <button type="button" role="tab" data-mode="explode" aria-selected="false">爆炸拆解</button>
          <button type="button" role="tab" data-mode="loader" aria-selected="false">装填与击发</button>
          <button type="button" role="tab" data-mode="analysis" aria-selected="false">入射分析</button>
          <button type="button" role="tab" data-mode="damage" aria-selected="false">模块损伤</button>
        </nav>
      </header>
      <main class="stage">
        <div class="viewport" id="viewport">
          <canvas id="scene" aria-label="T-80U-E1 三维模型"></canvas>
          <svg class="leaders" id="leaders" aria-hidden="true"></svg>
          <div class="labels" id="labels"></div>
          <div class="hud" id="hud"></div>
          <div class="view-tools">
            <button type="button" class="icon-btn" id="btnResetView" title="重置视角" aria-label="重置视角">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" class="icon-btn" id="btnTheme" title="切换明暗主题" aria-label="切换明暗主题">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 5a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <aside class="panel" id="panel" aria-label="控制面板">
          <button type="button" class="panel-toggle" id="panelToggle" aria-expanded="true"><i></i><span>收起面板</span></button>
          <div class="panel-body" id="panelBody"></div>
        </aside>
      </main>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="loading" id="loading">正在构建三维模型…</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
