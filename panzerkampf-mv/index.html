<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panzerkampf MV</title>
<style>
  :root{
    --bg:#07090c; --ink:#e9e4d6; --muted:#9aa3ab; --steel:#8fa3b3;
    --red:#c8281e; --red-hi:#ff5a3c; --brass:#c9a24b; --panel:rgba(10,13,17,.78);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","WenQuanYi Zen Hei",system-ui,sans-serif}
  #stage{height:100%;display:grid;place-items:center}
  #frame{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:#000;overflow:hidden;user-select:none}
  #frame:fullscreen{width:100vw;height:100vh;aspect-ratio:auto}
  canvas{display:block;width:100%;height:100%}

  button,.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid rgba(233,228,214,.28);
    border-radius:999px;padding:.45em 1.1em;cursor:pointer;display:inline-flex;align-items:center;gap:.5em;
    backdrop-filter:blur(6px);transition:background .15s,border-color .15s}
  button:hover,.btn:hover{background:rgba(40,46,54,.9);border-color:var(--brass)}
  button:focus-visible,.btn:focus-within,input[type=range]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .primary{background:var(--red);border-color:var(--red-hi)}
  .primary:hover{background:var(--red-hi)}
  small{opacity:.75;font-size:.78em}

  #start{position:absolute;left:0;right:0;bottom:0;padding:0 4% 7%;display:flex;flex-direction:column;align-items:center;gap:.9em;
    background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,0));padding-top:12%;font-size:clamp(12px,1.9vw,18px)}
  #start .btns{display:flex;flex-wrap:wrap;gap:.8em;justify-content:center}
  #start p{max-width:46em;text-align:center;color:var(--muted);font-size:.85em;line-height:1.6}
  #frame.started #start{display:none}

  #bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:.7em;flex-wrap:wrap;
    padding:.7em 1.2em;font-size:clamp(11px,1.5vw,14px);background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));
    transition:opacity .35s}
  #frame:not(.started) #bar{display:none}
  #frame.idle #bar{opacity:0;pointer-events:none}
  #frame.idle{cursor:none}
  #bar button,#bar .btn{padding:.35em .9em}
  #tm,#sync{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  #seek{flex:1 1 160px;min-width:120px;accent-color:var(--red-hi)}
  #rec.on{background:var(--red);border-color:var(--red-hi)}
  #toast{position:absolute;top:8%;left:50%;transform:translateX(-50%);background:var(--panel);padding:.45em 1.1em;border-radius:999px;
    font-size:clamp(11px,1.6vw,15px);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="c" width="1280" height="720" aria-label="Panzerkampf 音乐 MV 画面"></canvas>

    <div id="start">
      <div class="btns">
        <button id="goDemo" class="primary">▶ 开始播放 <small>合成节拍演示</small></button>
        <label class="btn" for="file">♫ 载入我的 Panzerkampf 音频</label>
      </div>
      <p>没有音频文件也能观看（使用原创的简易合成节拍，98 BPM · F♯ 小调）。载入你自己合法获得的 Panzerkampf 音频（mp3 / wav / flac / ogg，也可直接拖进窗口）后，画面会跟随真实低频鼓点律动。</p>
    </div>

    <div id="bar">
      <button id="pp" aria-label="播放 / 暂停">▶</button>
      <span id="tm">0:00 / 0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="进度">
      <span id="sync" title="键盘 [ ] 微调音画同步">同步 +0.0s</span>
      <label class="btn" for="file">♫ 音频</label>
      <button id="rec" title="从头播放并录制为 .webm 视频文件">● 录制 WebM</button>
      <button id="fs" aria-label="全屏">⛶</button>
    </div>
    <div id="toast" role="status"></div>
    <input id="file" type="file" accept="audio/*" hidden>
  </div>
</div>

<script>
(() => {
'use strict';

/* ───────────────────────── 基础常量 ───────────────────────── */
const W = 1280, H = 720, TAU = Math.PI * 2;
const BPM = 98, BEAT = 60 / BPM, BAR = BEAT * 4;           // 98 BPM · 4/4 · F♯ minor
const BAR_H = 44;                                           // 上下黑边高度
const FONT_ZH = '"Noto Sans SC","PingFang SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif';
const FONT_EN = 'Oswald,"Bebas Neue",Impact,Haettenschweiler,"Arial Narrow Bold","Arial Narrow",sans-serif';
const COL = { ink: '#e9e4d6', steel: '#8fa3b3', red: '#c8281e', redHi: '#ff5a3c', brass: '#c9a24b' };

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const rng = (a) => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const fmt = (t) => { t = Math.max(0, t); return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); };
const num = (n) => Math.round(n).toLocaleString('en-US');

/* ─────────────────── 时间线：按 98 BPM 的小节划分段落 ───────────────────
   段落边界是根据歌曲结构（5:15、98 BPM、4/4）估算的，并未逐帧对齐原曲；
   若载入真实音频后觉得对不上，用键盘 [ ] 微调整体偏移即可。            */
const SECTIONS = [
  { id: 'intro', bars: 8,  tag: 'PRELUDE',      zh: '序章',     scene: 'steppe',  energy: .35, capEnd: 7,
    cap: [[0.5, '1943 年夏 · 库尔斯克', 'Kursk, summer 1943'], [4, '钢铁洪流正在集结', 'The armour gathers']] },
  { id: 'v1',    bars: 16, tag: 'VERSE I',      zh: '第一节',   scene: 'map',     energy: .55,
    cap: [[0, '7 月 5 日 · 德军发动“堡垒行动”', '5 July · Operation Citadel begins'],
          [4, '南北两路钳形合击库尔斯克突出部', 'Pincers close on the Kursk salient'],
          [8, '约 77.7 万人 · 2,451 辆坦克与突击炮', '~777,000 men · 2,451 tanks & assault guns'],
          [12, '成千上万的坦克，列阵待发', 'Thousands of tanks stand in line']] },
  { id: 'pre1',  bars: 8,  tag: 'PRE-CHORUS',   zh: '布防',     scene: 'mines',   energy: .6,
    cap: [[0, '苏军构筑纵深防御：6 道防线，纵深 130–150 公里', 'Six defensive belts, 130–150 km deep'],
          [3.5, '夜幕掩护下，埋设了 94 万余枚地雷', 'Over 943,000 mines laid under cover of night'],
          [6.5, '静待时机 · 陷阱已经张开', 'Waiting. The trap is set']] },
  { id: 'ch1',   bars: 16, tag: 'CHORUS',       zh: '副歌',     scene: 'clash',   energy: 1,
    cap: [[0, 'PANZERKAMPF · 装甲对决', 'Tank battle'],
          [6, '钢铁撞上钢铁', 'Steel meets steel'],
          [11, '钢铁洪流撞进了陷阱', 'The armoured tide meets the trap']] },
  { id: 'v2',    bars: 16, tag: 'VERSE II',     zh: '第二节',   scene: 'prok',    energy: .75,
    cap: [[0, '7 月 12 日 · 普罗霍罗夫卡', '12 July · Prokhorovka'],
          [4, '近距离的坦克混战', 'Armour at point-blank range'],
          [8, '尘土、烟火与燃烧的钢铁', 'Dust, smoke and burning steel'],
          [12, '战场成了双方的熔炉', 'A furnace for both sides']] },
  { id: 'pre2',  bars: 8,  tag: 'PRE-CHORUS',   zh: '转折',     scene: 'prok',    energy: .8, cont: true,
    cap: [[0, '德军的冲击被迫减速', 'The assault slows'],
          [4, '战局开始向苏军一侧倾斜', 'The tide begins to turn']] },
  { id: 'ch2',   bars: 16, tag: 'CHORUS',       zh: '副歌',     scene: 'clash',   energy: 1,
    cap: [[0, 'PANZERKAMPF · 装甲对决', 'Tank battle'],
          [8, '史上规模最大的坦克战之一', 'One of history’s largest tank battles']] },
  { id: 'br',    bars: 16, tag: 'BRIDGE · SOLO', zh: '间奏',    scene: 'wreck',   energy: .5,
    cap: [[0, '硝烟散去，原野上满是残骸', 'The smoke clears over a field of wrecks'],
          [6, '全战役估计伤亡 · 德军 16.5–20.3 万', 'Est. casualties, whole battle · German 165–203k'],
          [10, '苏军约 86.3 万', 'Soviet ~863k'],
          [14, '代价沉重', 'A heavy price']] },
  { id: 'ch3',   bars: 16, tag: 'FINAL CHORUS', zh: '终章副歌', scene: 'counter', energy: 1,
    cap: [[0, '苏军转入反攻', 'The Red Army counterattacks'],
          [4, '库图佐夫行动 · 7 月 12 日', 'Operation Kutuzov · 12 July'],
          [8, '鲁勉采夫统帅行动 · 8 月 3 日', 'Operation Rumyantsev · 3 August'],
          [12, '德军被一路逼退', 'The Wehrmacht is driven back']] },
  { id: 'out',   bars: 9,  tag: 'OUTRO',        zh: '尾声',     scene: 'dawn',    energy: .3, capEnd: 6.4,
    cap: [[0, '8 月 23 日 · 战役结束', '23 August · The battle ends'],
          [2.4, '德军在东线最后一次大规模攻势被挡下', 'The last major German offensive in the East is halted'],
          [4.8, '战争的主动权，从此易手', 'The initiative has changed hands']] },
];
let acc = 0;
for (const s of SECTIONS) { s.start = acc * BAR; acc += s.bars; s.end = acc * BAR; s.len = s.end - s.start; }
const TOTAL = acc * BAR;                                    // ≈ 315.9 s
const secAt = (t) => SECTIONS.find((s) => t < s.end) || SECTIONS[SECTIONS.length - 1];

/* ───────────────────────── 全局状态 ───────────────────────── */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = (id) => document.getElementById(id);
const frameEl = $('frame');

const S = { t: 0, sec: SECTIONS[0], secIdx: 0, secT: 0, secP: 0, beat: 0, beatPh: 0, bar: 0, kick: 0, snare: 0, bass: 0, energy: .3 };
const P = {
  mode: 'demo', playing: false, base: 0, t0: 0, sync: 0, fileName: '',
  time() {
    if (this.mode === 'audio') return (audioEl ? audioEl.currentTime : 0) + this.sync;
    return this.playing ? this.base + (performance.now() - this.t0) / 1000 : this.base;
  },
  duration() { return this.mode === 'audio' && audioEl && isFinite(audioEl.duration) ? audioEl.duration + this.sync : TOTAL; },
};

/* ───────────────────────── 音频：合成节拍 + 真实音频分析 ───────────────────────── */
let actx = null, master = null, analyser = null, recDest = null, audioEl = null, fft = null, noiseBuf = null;

function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = .85;
  analyser = actx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = .5;
  fft = new Uint8Array(analyser.frequencyBinCount);
  recDest = actx.createMediaStreamDestination();
  master.connect(analyser); analyser.connect(actx.destination); master.connect(recDest);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  audioEl = new Audio(); audioEl.preload = 'auto';
  actx.createMediaElementSource(audioEl).connect(master);
  audioEl.addEventListener('ended', onEnded);
  audioEl.addEventListener('error', () => { P.mode = 'demo'; P.base = 0; toast('无法播放这个音频文件，已切回合成节拍'); });
}

const env = (g, w, a, d, peak) => {
  g.gain.setValueAtTime(0.0001, w); g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), w + a);
  g.gain.exponentialRampToValueAtTime(0.0001, w + a + d);
};
function tone(w, f, dur, type, v, lp) {
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
  let node = o; if (lp) { const l = actx.createBiquadFilter(); l.type = 'lowpass'; l.frequency.value = lp; o.connect(l); node = l; }
  node.connect(g); g.connect(master); env(g, w, Math.min(.02, dur / 4), dur, v); o.start(w); o.stop(w + dur + .05);
}
function noise(w, dur, ftype, freq, v) {
  const n = actx.createBufferSource(); n.buffer = noiseBuf; const f = actx.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
  const g = actx.createGain(); n.connect(f); f.connect(g); g.connect(master); env(g, w, .002, dur, v); n.start(w, Math.random() * .5); n.stop(w + dur + .05);
}
function kick(w, v) {
  const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(140, w); o.frequency.exponentialRampToValueAtTime(42, w + .14);
  env(g, w, .003, .26, v); o.connect(g); g.connect(master); o.start(w); o.stop(w + .35);
}
const snare = (w, v) => { noise(w, .16, 'bandpass', 1900, v); tone(w, 190, .1, 'triangle', v * .5); };
const hat = (w, v) => noise(w, .05, 'highpass', 7500, v);
const tom = (w, f, v) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(f * 1.5, w); o.frequency.exponentialRampToValueAtTime(f, w + .12); env(g, w, .004, .32, v);
  o.connect(g); g.connect(master); o.start(w); o.stop(w + .4); };

const ROOTS = [92.5, 73.42, 110.0, 82.41];                  // F♯ – D – A – E（原创的简易四小节循环）
const synth = {
  timer: 0, next: 0,
  start() { this.stop(); this.next = Math.ceil(P.time() / BEAT - 1e-6); this.timer = setInterval(() => this.tick(), 40); this.tick(); },
  stop() { clearInterval(this.timer); this.timer = 0; },
  tick() {
    if (!actx || P.mode !== 'demo' || !P.playing) return;
    const now = P.time();
    while (this.next * BEAT < now + .3) { this.beat(this.next); this.next++; }
  },
  beat(n) {
    const tm = n * BEAT; if (tm >= TOTAL) return;
    const when = actx.currentTime + (tm - P.time()); if (when < actx.currentTime - .02) return;
    const w = Math.max(when, actx.currentTime);
    const s = secAt(tm), e = s.energy, b = n % 4, bar = Math.floor(n / 4);
    const chorus = s.id.startsWith('ch'), root = ROOTS[bar % 4];
    if (s.id === 'intro') { if (b === 0) tom(w, 70, .5); if (b === 2 && bar > 1) tom(w, 85, .4); }
    else {
      if (b === 0 || b === 2) kick(w, .45 + .4 * e);
      if (chorus && b % 2 === 0) kick(w + BEAT / 2, .4);
      if (b === 1 || b === 3) snare(w, .18 + .25 * e);
    }
    if (chorus || s.id === 'br') { hat(w, .1); hat(w + BEAT / 2, .07); }
    if (b === 0) { tone(w, root * 2, BAR, 'sawtooth', .05 * e + .015, 900); tone(w, root * 3.01, BAR, 'sawtooth', .035 * e + .01, 900); }
    if (s.id !== 'intro' || bar > 3) {
      tone(w, root, BEAT * .9, 'triangle', .22 * (.4 + e * .6), 400);
      if (chorus) tone(w + BEAT / 2, root, BEAT * .4, 'triangle', .16, 400);
    }
  },
};

/* ───────────────────── 节拍 / 低频：驱动画面律动 ───────────────────── */
let bassAvg = 0, prevBass = 0, cool = 0;
const hitLog = [];                                          // 真实音频模式下检测到的鼓点
function updateState(t, dt) {
  S.t = t; S.sec = secAt(t); S.secIdx = SECTIONS.indexOf(S.sec);
  S.secT = Math.max(0, t - S.sec.start); S.secP = clamp(S.secT / S.sec.len);
  const bf = Math.max(0, t) / BEAT; S.beat = Math.floor(bf); S.beatPh = bf - S.beat; S.bar = Math.floor(bf / 4);
  const e = S.sec.energy;
  if (P.mode === 'audio' && analyser && isPlaying()) {
    analyser.getByteFrequencyData(fft);
    let b = 0, m = 0; for (let i = 1; i <= 4; i++) b += fft[i]; for (let i = 5; i < 40; i++) m += fft[i];
    b = b / 4 / 255; m = m / 35 / 255;
    const flux = b - prevBass; prevBass = b;                // 只在低频能量“上升沿”触发，一个鼓点只算一次
    bassAvg = bassAvg * .93 + b * .07; cool -= dt;
    if (flux > .04 && b > bassAvg * 1.1 + .03 && cool <= 0) { hitLog.push({ t, seed: (Math.random() * 1e9) | 0 }); cool = .14; S.kick = Math.max(S.kick, clamp(b * 1.3)); }
    S.kick = Math.max(S.kick * Math.exp(-dt * 9), b * .85);
    S.bass = b; S.energy = lerp(S.energy, clamp(m * 2.4 + .15), clamp(dt * 3));
    while (hitLog.length && (t - hitLog[0].t > 2 || t < hitLog[0].t - 1)) hitLog.shift();
  } else if (P.mode === 'audio') {
    S.kick *= Math.exp(-dt * 6);
  } else {
    const strong = S.beat % 4 === 0 ? 1 : S.beat % 4 === 2 ? .85 : .55;
    S.kick = Math.exp(-S.beatPh * 5.5) * strong * (.5 + .5 * e);
    S.snare = S.beat % 2 === 1 ? Math.exp(-S.beatPh * 7) : 0;
    S.bass = S.kick; S.energy = lerp(S.energy, e, clamp(dt * 3));
  }
}
// 最近 win 秒内的鼓点（演示模式由节拍网格解析得到，因此拖动进度条也能还原画面）
function recentHits(win) {
  if (P.mode === 'audio') return hitLog.filter((h) => S.t - h.t >= 0 && S.t - h.t < win).map((h) => ({ age: S.t - h.t, seed: h.seed, str: 1 }));
  const out = [], b1 = Math.floor(S.t / BEAT);
  for (let b = b1; b > b1 - Math.ceil(win / BEAT) - 1 && b >= 0; b--) {
    const age = S.t - b * BEAT; if (age >= 0 && age < win) out.push({ age, seed: b * 7919 + 13, str: b % 4 === 0 ? 1 : b % 4 === 2 ? .85 : .6 });
  }
  return out;
}

/* ───────────────────────── 绘图工具 ───────────────────────── */
function vgrad(c, y0, y1, stops) {
  const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => g.addColorStop(o, col));
  c.fillStyle = g; c.fillRect(0, y0, W, y1 - y0);
}
function glow(c, x, y, r, col) {
  c.save(); c.globalCompositeOperation = 'lighter';
  const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.restore();
}
function puff(c, x, y, r, a, rgb = '18,14,12') {                    // 柔边烟团
  const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
function band(c, cx, cy, rx, ry, a, rgb) {                           // 柔边云带 / 烟带
  c.save(); c.translate(cx, cy); c.scale(1, ry / rx); puff(c, 0, 0, rx, a, rgb); c.restore();
}
function text(c, s, x, y, o = {}) {
  const { font = FONT_ZH, size = 24, w = 700, col = COL.ink, align = 'left', alpha = 1, stroke = 0, ls = 0, italic = false, maxW = 0 } = o;
  let sz = size, sp = ls;
  c.save(); c.globalAlpha *= alpha; c.textAlign = align; c.textBaseline = 'alphabetic';
  const setFont = () => { c.font = `${italic ? 'italic ' : ''}${w} ${sz}px ${font}`; if ('letterSpacing' in c) c.letterSpacing = sp + 'px'; };
  setFont();
  if (maxW) { const mw = c.measureText(s).width; if (mw > maxW) { sz *= maxW / mw; sp *= maxW / mw; setFont(); } }   // 超宽则整体缩小
  if (align === 'center') x += sp / 2;
  if (stroke) { c.lineJoin = 'round'; c.lineWidth = stroke; c.strokeStyle = 'rgba(0,0,0,.72)'; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y); c.restore();
}
function rrect(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }

    const mx = sp.x + dir * 72 * sp.sc, my = sp.y - 43 * sp.sc, tx = tp.x, ty = tp.y - 30 * tp.sc;
    if (h.age < .14) glow(c, mx, my, 70 * (1 - h.age / .14) + 10, 'rgba(255,210,120,.9)');
    if (h.age < .2) { const u = h.age / .2; c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = 'rgba(255,230,160,.9)'; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(lerp(mx, tx, Math.max(0, u - .25)), lerp(my, ty, Math.max(0, u - .25))); c.lineTo(lerp(mx, tx, u), lerp(my, ty, u)); c.stroke(); c.restore(); }

}

/* ───────────────────────── 场景 5：普罗霍罗夫卡 · 坦克混战（俯视） ───────────────────────── */
const PK = (() => { const r = rng(4242), a = [];
  for (let i = 0; i < 40; i++) a.push({ side: i % 2 ? 1 : -1, y0: 140 + r() * 440, mx: W / 2 + (r() - .5) * 380, my: 190 + r() * 340, ta: 6 + r() * 10,
    td: r() < .78 ? 12 + r() * 40 : 1e9, ph: r() * 6.28, rad: 14 + r() * 32, spd: .5 + r() * .6, fp: 1.6 + r() * 2.2, fo: r() * 3, seed: i * 31 + 5 });
  return a; })();
function pkPos(a, tt) {
  tt = Math.min(tt, a.td);
  const k = clamp(tt / a.ta), e = k * k * (3 - 2 * k), sx = a.side < 0 ? -50 : W + 50;
  let x = lerp(sx, a.mx, e), y = lerp(a.y0, a.my, e) + Math.sin(tt * a.spd + a.ph) * 18 * (1 - e);
  if (k >= 1) { const q = tt - a.ta, w = .35 * a.spd; x += a.rad * (Math.cos(a.ph + q * w) - Math.cos(a.ph)); y += a.rad * .7 * (Math.sin(a.ph + q * w * 1.3) - Math.sin(a.ph)); }
  return [x, y];
}
function scenePk(c) {
  const T = S.secT + (S.sec.cont ? SECTIONS[S.secIdx - 1].len : 0), p = clamp(T / (SECTIONS[4].len + SECTIONS[5].len));
  c.drawImage(GROUND, 0, 0);
  for (const a of PK) {                                      // 履带印
    let prev = null; c.lineWidth = 5; c.lineCap = 'round';
    for (let j = 0; j <= 16; j++) { const q = pkPos(a, T - j * .18); if (prev) { c.strokeStyle = `rgba(0,0,0,${.3 * (1 - j / 16)})`; c.beginPath(); c.moveTo(prev[0], prev[1]); c.lineTo(q[0], q[1]); c.stroke(); } prev = q; }
  }
  for (const a of PK) if (T >= a.td) {                       // 残骸与浓烟
    const [x, y] = pkPos(a, T), age = T - a.td, flick = .6 + .4 * Math.sin(T * 9 + a.ph);
    tankTop(c, x, y, a.ph, '#0e0c0a', '#3a2a20');
    glow(c, x, y, 26 * flick + 8, 'rgba(255,110,40,.5)');
    for (let j = 0; j < 5; j++) { const u = (age * .22 + j / 5) % 1; puff(c, x + Math.sin(u * 4 + j) * 8, y - u * 100, 12 + u * 34, (1 - u) * .5); }
  }
  for (const a of PK) if (T < a.td) {
    const [x, y] = pkPos(a, T), [x2, y2] = pkPos(a, T + .06), ang = Math.atan2(y2 - y, x2 - x) || (a.side < 0 ? 0 : Math.PI);
    tankTop(c, x, y, ang, a.side < 0 ? '#4a5864' : '#6a2a22', a.side < 0 ? COL.steel : '#e0502f');
    const f = (T + a.fo) % a.fp;
    if (T > a.ta * .7 && f < .13) { const u = 1 - f / .13; glow(c, x + Math.cos(ang) * 30, y + Math.sin(ang) * 30, 22 * u + 6, 'rgba(255,220,140,.95)'); }
  }
  for (const a of PK) if (T >= a.td) boom(c, ...pkPos(a, T), T - a.td, a.seed, 1.15);
  c.fillStyle = `rgba(160,105,50,${.07 + p * .13 + S.kick * .03})`; c.fillRect(0, 0, W, H);   // 尘雾随战斗加深
  text(c, '12 JULY 1943 · PROKHOROVKA', 40, 140, { font: FONT_EN, size: 16, w: 500, col: 'rgba(233,228,214,.7)', ls: 3, stroke: 4 });
  text(c, '示意：俯视视角 · 非逐辆还原', 40, 160, { size: 12, col: 'rgba(233,228,214,.45)', stroke: 3 });
}

/* ───────────────────────── 场景 6：间奏 · 残骸与代价 ───────────────────────── */
const WR = (() => { const r = rng(909), a = []; for (let i = 0; i < 9; i++) a.push({ x: 80 + i * 150 + r() * 60, y: H * (.8 + r() * .08), sc: .95 + r() * .6, dir: r() < .5 ? 1 : -1, tilt: (r() - .5) * .35, ph: r() * 6 }); return a; })();
const EMB = (() => { const r = rng(31), a = []; for (let i = 0; i < 70; i++) a.push({ x: r() * W, s: r(), w: r() }); return a; })();
function sceneWreck(c) {
  const t = S.secT, p = S.secP;
  vgrad(c, 0, H * .7, [[0, '#050405'], [.45, '#2a0c0c'], [1, '#8a2a14']]);
  glow(c, W * .62, H * .55, 440, 'rgba(220,70,30,.45)'); c.fillStyle = 'rgba(235,110,60,.82)'; c.beginPath(); c.arc(W * .62, H * .55, 46, 0, TAU); c.fill();
  for (let i = 0; i < 7; i++) band(c, ((i * 240 + t * (6 + i * 2)) % (W + 500)) - 250, 120 + (i % 4) * 65, 290, 50 + i * 5, .6, '10,6,6');
  hills(c, H * .72, 8, .005, 4, '#0a0606', t, 2); c.fillStyle = '#0a0606'; c.fillRect(0, H * .74, W, H);
  const pan = -t * 5;
  for (const w of WR) {
    const x = ((w.x + pan) % (W + 200) + W + 200) % (W + 200) - 100, y = w.y;
    tank(c, x, y, w.sc, w.dir, '#060505', 'rgba(255,120,60,.45)', { tilt: w.tilt });
    const fl = .65 + .35 * Math.sin(t * 8 + w.ph * 3) * Math.sin(t * 3.3 + w.ph);
    glow(c, x, y - 40 * w.sc, 54 * w.sc * fl + 12, 'rgba(255,110,40,.55)');
    for (let j = 0; j < 5; j++) { const u = (t * .1 + j / 5 + w.ph) % 1; puff(c, x + Math.sin(u * 5 + j + w.ph) * 14, y - 60 * w.sc - u * 260, 16 + u * 52, (1 - u) * .6, '12,8,8'); }
  }
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const e of EMB) { const u = (t * (.05 + e.s * .06) + e.w) % 1; c.fillStyle = `rgba(255,${120 + e.s * 90 | 0},60,${(1 - u) * .8})`; c.fillRect(e.x + Math.sin(u * 9 + e.w * 9) * 26, H * .82 - u * H * .7, 2, 2); }
  c.restore();
  const a = sm(6 * BAR, 6.8 * BAR, t) * (1 - sm(14.5 * BAR, 15.5 * BAR, t));              // 估计伤亡对比
  if (a > 0) {
    const gk = sm(6.2 * BAR, 8.5 * BAR, t), sk = sm(9.5 * BAR, 12 * BAR, t), sc2 = 380 / 863000, bx = 800, by = 190;
    c.save(); c.globalAlpha = a; c.fillStyle = 'rgba(8,8,10,.72)'; rrect(c, bx - 26, by - 52, 470, 210, 10); c.fill(); c.restore();
    text(c, '全战役估计伤亡 · EST. CASUALTIES (WHOLE BATTLE)', bx, by - 24, { size: 12, col: COL.steel, alpha: a, ls: 1 });
    c.save(); c.globalAlpha = a;
    c.fillStyle = COL.steel; c.fillRect(bx, by, 165000 * sc2 * gk, 26); c.fillStyle = 'rgba(143,163,179,.4)'; c.fillRect(bx + 165000 * sc2 * gk, by, 38000 * sc2 * gk, 26);
    c.fillStyle = COL.redHi; c.fillRect(bx, by + 78, 863000 * sc2 * sk, 26); c.restore();
    text(c, '德军 GERMAN  165,000–203,000', bx, by + 54, { size: 14, alpha: a * gk });
    text(c, '苏军 SOVIET  ~863,000', bx, by + 132, { size: 14, alpha: a * sk });
  }
}

const SCENES = { steppe: sceneSteppe, map: sceneMap, mines: sceneMines, clash: sceneClash, prok: scenePk, wreck: sceneWreck, counter: sceneCounter, dawn: sceneDawn };

/* ───────────────────────── 叠层：字幕 · 标题 · 黑边 · HUD ───────────────────────── */
function captions(c) {
  const s = S.sec, bars = S.secT / BAR; let idx = -1;
  for (let i = 0; i < s.cap.length; i++) if (bars >= s.cap[i][0]) idx = i;
  if (idx < 0) return;
  const t0 = s.cap[idx][0] * BAR, nxt = idx + 1 < s.cap.length ? s.cap[idx + 1][0] : (s.capEnd ?? s.bars), t1 = nxt * BAR;
  if (S.secT > t1) return;
  const a = Math.min(sm(t0, t0 + .45, S.secT), 1 - sm(t1 - .4, t1, S.secT)), rise = (1 - sm(t0, t0 + .5, S.secT)) * 14;
  c.save(); const g = c.createLinearGradient(0, H - 190, 0, H - BAR_H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${.62 * a})`);
  c.fillStyle = g; c.fillRect(0, H - 190, W, 190 - BAR_H); c.restore();
  const y = H - 112 + rise;
  text(c, s.cap[idx][1], W / 2, y, { size: 36, w: 800, align: 'center', alpha: a, stroke: 7, ls: 1, maxW: 1100 });
  text(c, s.cap[idx][2], W / 2, y + 34, { font: FONT_EN, size: 20, w: 400, align: 'center', alpha: a * .9, col: COL.steel, ls: 2, stroke: 5, maxW: 1100 });
}
function sectionTag(c) {
  const s = S.sec, a = sm(0, .5, S.secT) * (1 - sm(s.len - .6, s.len, S.secT)), x = 40 + (1 - sm(0, .6, S.secT)) * -24, y = BAR_H + 26;
  c.save(); c.globalAlpha = a; c.fillStyle = s.id.startsWith('ch') ? COL.red : 'rgba(10,13,17,.85)'; rrect(c, x, y, 12 + s.tag.length * 10.4, 24, 3); c.fill(); c.restore();
  text(c, s.tag, x + 8, y + 17, { font: FONT_EN, size: 14, w: 600, ls: 2, alpha: a });
  text(c, s.zh, x + 18 + s.tag.length * 10.4, y + 18, { size: 16, alpha: a * .85, col: COL.steel, stroke: 4 });
}
function titleCard(c) {
  if (S.sec.id !== 'intro') return;
  const t = S.secT, a = sm(.8, 2.2, t) * (1 - sm(13.5, 16.5, t)), z = 1 + (1 - sm(.8, 4, t)) * .05;
  if (a <= 0) return;

  text(c, 'PANZERKAMPF', 0, 0, { font: FONT_EN, size: 150, w: 700, align: 'center', alpha: a, ls: 14, stroke: 10, maxW: 1040 });
  text(c, '库尔斯克会战 · THE BATTLE OF KURSK · 1943', 0, 48, { size: 24, w: 500, align: 'center', alpha: a, col: COL.brass, ls: 6, stroke: 5 });
  text(c, 'SABATON  ·  THE ART OF WAR (2008)  ·  98 BPM  ·  F♯ MINOR', 0, 88, { font: FONT_EN, size: 16, w: 400, align: 'center', alpha: a * .8, col: COL.steel, ls: 4, stroke: 4 });
  c.restore();
}
function endCard(c) {
  if (S.sec.id !== 'out') return;
  const a = sm(S.sec.len - 5.8, S.sec.len - 4.2, S.secT) * (1 - sm(S.sec.len - .6, S.sec.len, S.secT)); if (a <= 0) return;
  c.save(); c.fillStyle = `rgba(0,0,0,${.35 * a})`; c.fillRect(0, 0, W, H); c.restore();
  text(c, 'PANZERKAMPF', W / 2, 330, { font: FONT_EN, size: 96, align: 'center', alpha: a, ls: 12, maxW: 760 });
  text(c, '音乐 / MUSIC  ·  SABATON — Panzerkampf  (The Art of War, 2008)', W / 2, 384, { size: 17, align: 'center', alpha: a * .9, col: COL.brass, ls: 2, stroke: 5 });
  text(c, '词曲 / WORDS & MUSIC  ·  Joakim Brodén · Pär Sundström', W / 2, 410, { size: 15, align: 'center', alpha: a * .9, col: COL.ink, ls: 1, stroke: 5 });
  text(c, '画面 / VISUALS  ·  原创 Canvas 动画 · 史实数据来自 Wikipedia', W / 2, 436, { size: 15, align: 'center', alpha: a * .9, col: COL.ink, ls: 1, stroke: 5 });
}
function hud(c) {
  c.fillStyle = '#000'; c.fillRect(0, 0, W, BAR_H); c.fillRect(0, H - BAR_H, W, BAR_H);
  text(c, 'KURSK · 1943', 40, 28, { font: FONT_EN, size: 14, w: 500, col: COL.steel, ls: 4 });
  text(c, `${fmt(S.t)}  /  ${fmt(Math.max(TOTAL, 0))}    ·    98 BPM    ·    F♯m    ·    BAR ${String(S.bar + 1).padStart(3, '0')}`, W - 40, 28, { font: FONT_EN, size: 14, w: 500, col: COL.steel, ls: 3, align: 'right' });
  const y = H - BAR_H + 20, w = W - 80;
  c.fillStyle = 'rgba(233,228,214,.16)'; c.fillRect(40, y, w, 2);
  for (const s of SECTIONS) { c.fillStyle = 'rgba(233,228,214,.4)'; c.fillRect(40 + s.start / TOTAL * w, y - 3, 1, 8); }
  c.fillStyle = COL.redHi; c.fillRect(40, y, clamp(S.t / TOTAL) * w, 2);
  for (let i = 0; i < 4; i++) { const on = S.beat % 4 === i; c.fillStyle = on ? COL.redHi : 'rgba(233,228,214,.2)'; c.beginPath(); c.arc(W - 40 - (3 - i) * 16, H - BAR_H + 8, on ? 3.6 : 2.6, 0, TAU); c.fill(); }
}
let grainOff = 0;
function render() {
  const c = ctx; c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const chorus = S.sec.id.startsWith('ch');
  c.save();
  const zoom = 1 + .012 + S.secP * .03 + S.kick * (chorus ? .022 : .008);
  c.translate(W / 2, H / 2); c.scale(zoom, zoom); c.translate(-W / 2, -H / 2);
  if (S.sec.scene === 'clash') c.translate((Math.random() - .5) * S.kick * 10, (Math.random() - .5) * S.kick * 10);
  SCENES[S.sec.scene](c);
  c.restore();
  c.drawImage(VIG, 0, 0);
  grainOff = (grainOff + 97) % 256; c.save(); c.translate(-grainOff, -(grainOff * 3 % 256)); c.fillStyle = GRAIN_PAT; c.fillRect(0, 0, W + 256, H + 256); c.restore();
  if (chorus && S.secT < .9) { const f = 1 - S.secT / .9; c.fillStyle = `rgba(255,120,60,${.5 * f * f})`; c.fillRect(0, 0, W, H); }
  if (frameEl.classList.contains('started')) captions(c);
  sectionTag(c); titleCard(c); endCard(c);
  const joinIn = S.sec.cont, joinOut = SECTIONS[S.secIdx + 1] && SECTIONS[S.secIdx + 1].cont;   // 同一场景的相邻段落不淡出黑场
  const fade = Math.min(joinIn ? 1 : sm(0, .3, S.secT), joinOut ? 1 : 1 - sm(S.sec.len - .4, S.sec.len, S.secT));
  if (fade < 1) { c.fillStyle = `rgba(0,0,0,${(1 - fade) * .96})`; c.fillRect(0, 0, W, H); }

}

/* ───────────────────────── 播放控制 / UI ───────────────────────── */
const ui = { pp: $('pp'), tm: $('tm'), seek: $('seek'), sync: $('sync'), rec: $('rec'), toast: $('toast') };
let toastTimer = 0, idleTimer = 0, rec = null, recChunks = [];
const toast = (s) => { ui.toast.textContent = s; ui.toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => ui.toast.classList.remove('show'), 1800); };
const isPlaying = () => (P.mode === 'audio' ? !!audioEl && !audioEl.paused && !audioEl.ended : P.playing);

function play() {
  ensureAudio(); frameEl.classList.add('started');
  if (P.mode === 'audio') { if (audioEl.ended) audioEl.currentTime = 0; audioEl.play().catch(() => {}); }
  else { if (P.base >= TOTAL - .05) P.base = 0; P.t0 = performance.now(); P.playing = true; synth.start(); }
}
function pause() {
  if (P.mode === 'audio') { if (audioEl) audioEl.pause(); }
  else if (P.playing) { P.base = P.time(); P.playing = false; synth.stop(); }
}
function seek(t) {
  t = clamp(t, 0, P.duration() - .01);
  if (P.mode === 'audio') { if (audioEl) audioEl.currentTime = Math.max(0, t - P.sync); hitLog.length = 0; }
  else { P.base = t; P.t0 = performance.now(); if (P.playing) synth.start(); }
}
function onEnded() { P.playing = false; synth.stop(); if (rec) stopRecord(); }
function loadFile(f) {
  if (!f) return;
  ensureAudio(); pause(); if (P.fileName) URL.revokeObjectURL(audioEl.src);
  P.mode = 'audio'; P.fileName = f.name; audioEl.src = URL.createObjectURL(f); audioEl.load();
  toast('已载入：' + f.name); seek(0); play();
}

function startRecord(from = 0) {
  if (rec) return stopRecord();
  if (!window.MediaRecorder) return toast('当前浏览器不支持 MediaRecorder');
  ensureAudio(); frameEl.classList.add('started');
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8e6 }); recChunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
  rec.onstop = async () => {
    const blob = new Blob(recChunks, { type: 'video/webm' });
    rec = null; ui.rec.classList.remove('on'); ui.rec.textContent = '● 录制 WebM'; window.__mvLastRecording = blob.size;
    toast(await saveBlob(blob, 'panzerkampf-mv.webm'));
  };
  ui.rec.classList.add('on'); ui.rec.textContent = '■ 停止并保存'; toast('录制中：从头完整播放一遍，结束后自动下载');
  pause(); seek(from); rec.start(1000); play();
}
async function saveBlob(blob, name) {
  try {                                                      // 托管页面里不允许脚本直接下载，改走平台的“保存文件”确认框
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: name, data: blob }); return '已保存 ' + name; }
  } catch (e) { return e && e.code === 'declined' ? '已取消保存' : '保存失败：' + ((e && e.message) || e); }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return '已导出 ' + name;
}
function stopRecord() { if (rec && rec.state !== 'inactive') rec.stop(); }

$('goDemo').onclick = () => { P.mode = 'demo'; seek(0); play(); };
ui.pp.onclick = () => (isPlaying() ? pause() : play());
$('fs').onclick = () => {
  const r = document.fullscreenElement ? document.exitFullscreen() : frameEl.requestFullscreen && frameEl.requestFullscreen();
  if (r && r.catch) r.catch(() => toast('当前环境不支持全屏'));
};
ui.rec.onclick = () => startRecord();
$('file').onchange = (e) => { loadFile(e.target.files[0]); e.target.value = ''; };
ui.seek.oninput = () => seek(ui.seek.value / 1000 * P.duration());
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && /^audio\//.test(f.type)) loadFile(f); });
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); if (!frameEl.classList.contains('started')) { P.mode = 'demo'; seek(0); } isPlaying() ? pause() : play(); }
  else if (e.key === 'ArrowRight') seek(P.time() + 5); else if (e.key === 'ArrowLeft') seek(P.time() - 5);
  else if (e.key === '[' || e.key === ']') { P.sync = Math.round((P.sync + (e.key === ']' ? .1 : -.1)) * 10) / 10; toast(`音画同步偏移 ${P.sync >= 0 ? '+' : ''}${P.sync.toFixed(1)}s`); }
  else if (e.key === 'f' || e.key === 'F') $('fs').click(); else if (e.key === 'r' || e.key === 'R') { seek(0); play(); }
});
const wake = () => { frameEl.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (isPlaying()) frameEl.classList.add('idle'); }, 2600); };
frameEl.addEventListener('pointermove', wake); frameEl.addEventListener('pointerdown', wake);

let last = performance.now(), prevPlaying = false;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (P.mode === 'demo' && P.playing && P.time() >= TOTAL) { P.base = TOTAL; P.playing = false; synth.stop(); onEnded(); }
  const playing = isPlaying(), t = P.time();
  updateState(t, dt);
  render();
  ui.pp.textContent = playing ? '❚❚' : '▶';
  const dur = P.duration();
  ui.tm.textContent = `${fmt(t)} / ${fmt(dur)}`;
  if (document.activeElement !== ui.seek) ui.seek.value = clamp(t / dur) * 1000;
  ui.sync.textContent = `同步 ${P.sync >= 0 ? '+' : ''}${P.sync.toFixed(1)}s`;
  ui.sync.style.display = P.mode === 'audio' ? '' : 'none';
  if (playing !== prevPlaying) { prevPlaying = playing; wake(); }
  requestAnimationFrame(frame);
}
P.base = 3.5;                                                // 启动页背景：停在片头标题处
requestAnimationFrame(frame);
window.__mv = { P, S, SECTIONS, TOTAL, seek, play, pause, loadFile, startRecord, stopRecord, recentHits };
})();
